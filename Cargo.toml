[workspace]
members = ["native/gtk"]
resolver = "2"
exclude = ["third-party/syntect", "third-party/hayagriva", "third-party/biblatex"]

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

# PR builds exercise native code and GTK without shipping optimization costs.
[profile.ci]
inherits = "dev"
debug = 0
incremental = false
# Match the Windows shipping binary's subsystem selection in main.rs.
debug-assertions = false
lto = "off"
codegen-units = 256

[patch.crates-io]
# Upstream's quick-xml 0.41 migration fixes RUSTSEC-2026-0194/0195 without
# changing our pinned Typst 0.15.1 compiler or bibliography model.
citationberg = { git = "https://github.com/typst/citationberg", rev = "06a591e2f237d25e1dfdedac3f3d1494c496c52d" }

# Backport maintained replacements without changing Typst's diagnostic API.
syntect = { path = "third-party/syntect" }
hayagriva = { path = "third-party/hayagriva" }
biblatex = { path = "third-party/biblatex" }
