[workspace]
members = ["native/gtk"]
resolver = "2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

# PR builds exercise native code and GTK without shipping optimization costs.
[profile.ci]
inherits = "dev"
debug = 0
# Match the Windows shipping binary's subsystem selection in main.rs.
debug-assertions = false
lto = "off"
codegen-units = 256
