[package]
name = "typsmthng-gtk"
default-run = "typsmthng"
version = "0.1.9"
edition = "2021"
license = "MIT"
description = "Native GTK 4 desktop client for typsmthng"
publish = false

[features]
default = ["desktop"]
desktop = ["dep:gio", "dep:glib", "dep:gtk", "dep:adw", "dep:sourceview5"]
console = []

[lib]
name = "typsmthng_gtk"
path = "src/lib.rs"

[[bin]]
name = "typsmthng"
path = "src/main.rs"
required-features = ["desktop"]

[dependencies]
hex = "0.4.3"
directories = "6.0.0"
gio = { version = "0.22.10", optional = true }
glib = { version = "0.22.10", optional = true }
gtk = { package = "gtk4", version = "0.11.5", features = ["v4_12"], optional = true }
adw = { package = "libadwaita", version = "0.9.2", features = ["v1_5"], optional = true }
ignore = "0.4.33"
notify = "8.2.0"
regex = "1.13.1"
semver = { version = "1.0.28", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tempfile = "3.27.0"
thiserror = "2.0.21"
trash = "5.2.9"
sourceview5 = { version = "0.11.2", features = ["v5_4"], optional = true }
ureq = { version = "3.4.2", features = ["json"] }
url = "2.5.8"
wait-timeout = "0.2.1"
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }

typst = "=0.15.1"
typst-layout = "=0.15.1"
typst-svg = "=0.15.1"
typst-render = "=0.15.1"
typst-ide = "=0.15.1"
typstyle-core = "=0.15.2"
# Glyph ids for the font faces Typst exposes; same version Typst links.
ttf-parser = "0.25.1"
typst-kit = { version = "=0.15.1", features = ["datetime", "embedded-fonts", "scan-fonts", "system-files", "emit-diagnostics"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2.191"

[dev-dependencies]
filetime = "0.2.29"

[[bin]]
name = "typsmthng-updater"
path = "src/updater.rs"
