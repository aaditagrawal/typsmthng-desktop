[package]
name = "typsmthng-gtk"
default-run = "typsmthng"
version = "0.1.4"
edition = "2021"
license = "MIT"
description = "Native GTK 4 desktop client for typsmthng"
publish = false

[features]
default = []
console = []

[lib]
name = "typsmthng_gtk"
path = "src/lib.rs"

[[bin]]
name = "typsmthng"
path = "src/main.rs"

[dependencies]
directories = "6.0"
gio = "0.22"
glib = "0.22"
gtk = { package = "gtk4", version = "0.11", features = ["v4_12"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_5"] }
ignore = "0.4"
notify = "8.2"
regex = "1.11"
semver = { version = "1.0", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3.20"
thiserror = "2.0"
trash = "5.2"
sourceview5 = { version = "0.11", features = ["v5_4"] }
ureq = { version = "3.1", features = ["json"] }
url = "2.5"
wait-timeout = "0.2"
zip = { version = "6.0", default-features = false, features = ["deflate"] }

typst = "=0.15.1"
typst-layout = "=0.15.1"
typst-svg = "=0.15.1"
typst-ide = "=0.15.1"
# Glyph ids for the font faces Typst exposes; same version Typst links.
ttf-parser = "0.25"
typst-kit = { version = "=0.15.1", features = ["datetime", "embedded-fonts", "scan-fonts", "system-files", "emit-diagnostics"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
filetime = "0.2"

[[bin]]
name = "typsmthng-updater"
path = "src/updater.rs"
