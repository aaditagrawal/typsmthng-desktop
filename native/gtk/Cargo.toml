[package]
name = "typsmthng-gtk"
version = "0.2.0"
edition = "2021"
license = "MIT"
description = "Native GTK 4 desktop client for typsmthng"
publish = false

[features]
default = []
console = []

[lib]
name = "typsmthng_gtk"
path = "src/lib.rs"

[[bin]]
name = "typsmthng"
path = "src/main.rs"

[dependencies]
hex = "0.4.3"
directories = "6.0.0"
gio = "0.22.10"
glib = "0.22.10"
gtk = { package = "gtk4", version = "0.11.5", features = ["v4_6"] }
ignore = "0.4.33"
notify = "8.2.0"
regex = "1.13.1"
semver = { version = "1.0.28", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tempfile = "3.27.0"
thiserror = "2.0.21"
trash = "5.2.9"
sourceview5 = { version = "0.11.2", features = ["v5_4"] }
ureq = { version = "3.4.2", features = ["json"] }
url = "2.5.8"
wait-timeout = "0.2.1"
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2.191"

[dev-dependencies]
filetime = "0.2.29"
