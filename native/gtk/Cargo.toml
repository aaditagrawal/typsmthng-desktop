[package]
name = "typsmthng-gtk"
version = "0.2.0"
edition = "2021"
license = "MIT"
description = "Native GTK 4 desktop client for typsmthng"
publish = false

[features]
default = []
console = []

[lib]
name = "typsmthng_gtk"
path = "src/lib.rs"

[[bin]]
name = "typsmthng"
path = "src/main.rs"

[dependencies]
directories = "6.0"
gio = "0.22"
glib = "0.22"
gtk = { package = "gtk4", version = "0.11", features = ["v4_6"] }
ignore = "0.4"
notify = "8.2"
regex = "1.11"
semver = { version = "1.0", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3.20"
thiserror = "2.0"
trash = "5.2"
sourceview5 = { version = "0.11", features = ["v5_4"] }
ureq = { version = "3.1", features = ["json"] }
url = "2.5"
wait-timeout = "0.2"
zip = { version = "6.0", default-features = false, features = ["deflate"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
filetime = "0.2"
