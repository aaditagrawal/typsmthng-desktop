name: Build verified native GTK packages
on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      source_sha:
        required: true
        type: string
      macos_signing:
        required: false
        type: string
        default: unsigned
    outputs:
      artifact_name:
        description: Verified installers, checksum manifest, and source metadata
        value: ${{ jobs.verify.outputs.artifact_name }}
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      macos_signing: ${{ steps.version.outputs.macos_signing }}
      source_sha: ${{ steps.version.outputs.source_sha }}
      rust_toolchain: ${{ steps.version.outputs.rust_toolchain }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_sha }}
      - name: Release orchestration from the workflow commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.workflow_sha }}
          path: .release-tools
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          enable-cache: false
      - id: version
        env:
          RAW_VERSION: ${{ inputs.version }}
          REQUESTED_SIGNING: ${{ inputs.macos_signing }}
          EXPECTED_SOURCE_SHA: ${{ inputs.source_sha }}
        run: uv run --no-project .release-tools/packaging/release/source.py
  linux:
    needs: preflight
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.preflight.outputs.source_sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ needs.preflight.outputs.rust_toolchain }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
          shared-key: native-${{ runner.os }}-${{ runner.arch }}-release
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libgtksourceview-5-dev libadwaita-1-dev librsvg2-common adwaita-icon-theme ruby-dev rpm libfuse2 file xvfb dbus-x11
          sudo gem install --no-document fpm
          sudo curl -fsSL -o /usr/local/bin/linuxdeploy https://github.com/linuxdeploy/linuxdeploy/releases/download/1-alpha-20251107-1/linuxdeploy-x86_64.AppImage
          echo 'c20cd71e3a4e3b80c3483cef793cda3f4e990aca14014d23c544ca3ce1270b4d  /usr/local/bin/linuxdeploy' | sha256sum -c -
          sudo chmod +x /usr/local/bin/linuxdeploy
          sudo curl -fsSL -o /usr/local/bin/linuxdeploy-plugin-gtk https://raw.githubusercontent.com/linuxdeploy/linuxdeploy-plugin-gtk/7a3fbc31a9e5075073ff8790f26effbac5f84453/linuxdeploy-plugin-gtk.sh
          echo 'b0f4cbc684a0103a9651f0955b635eaea0096b3a66c0f5a2c2aa337960375171  /usr/local/bin/linuxdeploy-plugin-gtk' | sha256sum -c -
          sudo chmod +x /usr/local/bin/linuxdeploy-plugin-gtk
          sudo curl -fsSL -o /usr/local/bin/appimagetool https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          echo 'ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0  /usr/local/bin/appimagetool' | sha256sum -c -
          sudo chmod +x /usr/local/bin/appimagetool
      - name: Bundle Typst
        run: |
          packaging/download-typst.sh x86_64-unknown-linux-musl /tmp/typst-dist
          sudo install -m755 /tmp/typst-dist/typst /usr/local/bin/typst
      - name: Rust and GTK integration tests
        run: |-
          cargo test --locked --manifest-path native/gtk/Cargo.toml --all-targets
          dbus-run-session -- xvfb-run -a env GTK_A11Y=none GSK_RENDERER=cairo cargo test --locked --bin typsmthng native_preview_clicks_and_diagnostic_idle_timing -- --ignored --test-threads=1
          dbus-run-session -- xvfb-run -a env GTK_A11Y=none GSK_RENDERER=cairo cargo test --locked --bin typsmthng native_update_button_downloads_only_after_click -- --ignored --test-threads=1
      - name: Build native Debian and RPM packages
        run: packaging/linux/build-system-packages.sh "${VERSION}"
      - name: Build and verify AppImage
        run: |-
          packaging/linux/build-appimage.sh
          appimage="$(find build/release -maxdepth 1 -type f -name '*.AppImage' -print -quit)"
          test -n "$appimage"
          packaging/linux/check-appimage.sh "$appimage"
          dbus-run-session -- xvfb-run -a -s '-screen 0 1920x1080x24' env GTK_A11Y=none timeout 30s "$appimage" --appimage-extract-and-run --smoke-test
          dbus-run-session -- xvfb-run -a -s '-screen 0 1920x1080x24' env GTK_A11Y=none timeout 45s "$appimage" --appimage-extract-and-run --presentation-smoke-test native/gtk/tests/fixtures/demo
          dpkg-deb --info build/release/*.deb >/dev/null
          rpm -qip build/release/*.rpm >/dev/null
      - uses: actions/upload-artifact@v5
        with:
          name: package-linux-x64
          path: build/release/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
          overwrite: true
    env:
      VERSION: ${{ needs.preflight.outputs.version }}
  macos:
    needs: preflight
    strategy:
      matrix:
        include:
          - os: macos-14
            arch: arm64
          - os: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.preflight.outputs.source_sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ needs.preflight.outputs.rust_toolchain }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
          shared-key: native-${{ runner.os }}-${{ runner.arch }}-release
      - run: |
          brew install gtk4 gtksourceview5 libadwaita adwaita-icon-theme dylibbundler
          machine="$(uname -m)"
          [[ "$machine" == "arm64" ]] && machine="aarch64"
          packaging/download-typst.sh "${machine}-apple-darwin" /tmp/typst-dist
          sudo install -m755 /tmp/typst-dist/typst /usr/local/bin/typst
      - name: Import signing certificate
        if: needs.preflight.outputs.macos_signing == 'signed'
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
        run: |
          test -n "$MACOS_CERTIFICATE_P12"
          test -n "$MACOS_CERTIFICATE_PASSWORD"
          test -n "$MACOS_KEYCHAIN_PASSWORD"
          echo "$MACOS_CERTIFICATE_P12" | base64 -D > /tmp/signing.p12
          security create-keychain -p "$MACOS_KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$MACOS_KEYCHAIN_PASSWORD" build.keychain
          security import /tmp/signing.p12 -k build.keychain -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$MACOS_KEYCHAIN_PASSWORD" build.keychain
      - name: Build and bundle
        env:
          MACOS_CODESIGN_IDENTITY: ${{ secrets.MACOS_CODESIGN_IDENTITY }}
          MACOS_SIGNING_MODE: ${{ needs.preflight.outputs.macos_signing }}
        run: packaging/macos/bundle.sh "${VERSION}" "${ARCH}"
      - name: Verify packaged application
        run: |
          G_DEBUG=fatal-warnings build/release/typsmthng.app/Contents/MacOS/typsmthng --smoke-test
          G_DEBUG=fatal-warnings build/release/typsmthng.app/Contents/MacOS/typsmthng --presentation-smoke-test native/gtk/tests/fixtures/demo
          codesign --verify --deep --strict --verbose=2 build/release/typsmthng.app
      - name: Verify packaged updater replacement and relaunch
        run: |
          update_test="$(mktemp -d)"
          trap 'rm -rf "$update_test"' EXIT
          ditto build/release/typsmthng.app "$update_test/typsmthng.app"
          python3 packaging/test-update-helper.py \
            --helper build/release/typsmthng.app/Contents/MacOS/typsmthng-updater \
            --artifact "build/release/typsmthng-${VERSION}-macos-${ARCH}.dmg" \
            --target "$update_test/typsmthng.app" \
            --expected-binary build/release/typsmthng.app/Contents/MacOS/typsmthng
      - name: Notarize and staple
        if: needs.preflight.outputs.macos_signing == 'signed'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          test -n "$APPLE_ID"
          test -n "$APPLE_APP_PASSWORD"
          test -n "$APPLE_TEAM_ID"
          dmg="build/release/typsmthng-${VERSION}-macos-${ARCH}.dmg"
          xcrun notarytool submit "$dmg" --apple-id "$APPLE_ID" --password "$APPLE_APP_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
          xcrun stapler staple "$dmg"
          xcrun stapler validate "$dmg"
      - name: Verify disk image integrity
        run: hdiutil verify "build/release/typsmthng-${VERSION}-macos-${ARCH}.dmg"
      - uses: actions/upload-artifact@v5
        with:
          name: package-macos-${{ matrix.arch }}
          path: build/release/*.dmg
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
          overwrite: true
    env:
      VERSION: ${{ needs.preflight.outputs.version }}
      ARCH: ${{ matrix.arch }}
  windows:
    needs: preflight
    runs-on: windows-2022
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.preflight.outputs.source_sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ needs.preflight.outputs.rust_toolchain }}
          targets: x86_64-pc-windows-gnu
      - uses: msys2/setup-msys2@v2
        id: msys2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-toolchain mingw-w64-x86_64-gtk4 mingw-w64-x86_64-adwaita-icon-theme mingw-w64-x86_64-libadwaita mingw-w64-x86_64-gtksourceview5
            mingw-w64-x86_64-pkgconf mingw-w64-x86_64-nsis unzip
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
          shared-key: native-${{ runner.os }}-${{ runner.arch }}-release
      - name: Build
        env:
          RUSTUP_TOOLCHAIN: ${{ needs.preflight.outputs.rust_toolchain }}
        run: |
          "$(cygpath -u "$CARGO_HOME")/bin/rustup.exe" target add --toolchain "$RUSTUP_TOOLCHAIN" x86_64-pc-windows-gnu
          "$(cygpath -u "$CARGO_HOME")/bin/rustc.exe" --version --verbose
          export RUSTC="$(cygpath -m "$CARGO_HOME")/bin/rustc.exe"
          export PKG_CONFIG_ALLOW_CROSS=1
          export PKG_CONFIG_PATH=/mingw64/lib/pkgconfig:/mingw64/share/pkgconfig
          "$(cygpath -u "$CARGO_HOME")/bin/cargo.exe" build --locked --release --features console --target x86_64-pc-windows-gnu --manifest-path native/gtk/Cargo.toml
          packaging/download-typst.sh x86_64-pc-windows-msvc target/x86_64-pc-windows-gnu/release
          export PATH="/mingw64/bin:$PWD/target/x86_64-pc-windows-gnu/release:$PATH"
          timeout 20s target/x86_64-pc-windows-gnu/release/typsmthng.exe --smoke-test
          timeout 30s target/x86_64-pc-windows-gnu/release/typsmthng.exe --presentation-smoke-test native/gtk/tests/fixtures/demo
          "$(cygpath -u "$CARGO_HOME")/bin/cargo.exe" build --locked --release --target x86_64-pc-windows-gnu --manifest-path native/gtk/Cargo.toml
      - name: Collect GTK runtime
        env:
          TYPSMTHNG_MINGW_PREFIX: ${{ steps.msys2.outputs.msys2-location }}\mingw64
        shell: pwsh
        run: packaging/windows/collect-runtime.ps1
      - name: Installer
        run: |
          mkdir -p build/release
          makensis -WX -DVERSION="${VERSION}" packaging/windows/installer.nsi
      - name: Verify install, upgrade, uninstall, and unrelated file preservation
        shell: pwsh
        run: packaging/windows/test-installer.ps1
      - uses: actions/upload-artifact@v5
        with:
          name: package-windows-x64
          path: build/release/*.exe
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
          overwrite: true
    env:
      VERSION: ${{ needs.preflight.outputs.version }}
  flatpak:
    needs: preflight
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.preflight.outputs.version }}
      FLATPAK_CACHE: ${{ github.workspace }}/.cache/flatpak-release
      SOURCE_REPOSITORY: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.preflight.outputs.source_sha }}
      - name: Release orchestration from the workflow commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.workflow_sha }}
          path: .release-tools
          persist-credentials: false
      - name: Flatpak build and smoke-test dependencies
        run: |-
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder xvfb dbus-x11 jq
      - name: Install the GNOME SDK and runtime
        id: sdk
        run: |-
          sudo flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          sudo flatpak install -y flathub org.gnome.Platform//50 org.gnome.Sdk//50
          echo "commit=$(flatpak info --show-commit org.gnome.Sdk//50)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: |-
            .cache/flatpak-release/.flatpak-builder/cache
            .cache/flatpak-release/.flatpak-builder/downloads
            .cache/flatpak-release/cargo
            .cache/flatpak-release/target
          key: flatpak-x64-sdk-${{ steps.sdk.outputs.commit }}-rust-${{ needs.preflight.outputs.rust_toolchain }}-manifest-${{ hashFiles('packaging/flatpak/**') }}-lock-${{
            hashFiles('Cargo.lock') }}-${{ needs.preflight.outputs.source_sha }}
          restore-keys: |-
            flatpak-x64-sdk-${{ steps.sdk.outputs.commit }}-rust-${{ needs.preflight.outputs.rust_toolchain }}-manifest-${{ hashFiles('packaging/flatpak/**') }}-lock-${{ hashFiles('Cargo.lock') }}-
            flatpak-x64-sdk-${{ steps.sdk.outputs.commit }}-rust-${{ needs.preflight.outputs.rust_toolchain }}-manifest-${{ hashFiles('packaging/flatpak/**') }}-
      - name: Build and verify the cached Flatpak bundle
        run: .release-tools/packaging/flatpak/build.sh "$VERSION" "$PWD/build/release" "$FLATPAK_CACHE"
      - uses: actions/upload-artifact@v5
        with:
          name: package-flatpak-x64
          path: build/release/*.flatpak
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
          overwrite: true
  verify:
    needs:
      - preflight
      - linux
      - flatpak
      - macos
      - windows
    runs-on: ubuntu-24.04
    outputs:
      artifact_name: ${{ steps.verified.outputs.artifact_name }}
    env:
      VERSION: ${{ needs.preflight.outputs.version }}
      SOURCE_SHA: ${{ needs.preflight.outputs.source_sha }}
      SIGNING: ${{ needs.preflight.outputs.macos_signing }}
      RUST_TOOLCHAIN: ${{ needs.preflight.outputs.rust_toolchain }}
      REPOSITORY: ${{ github.repository }}
      BUILD_RUN_ID: ${{ github.run_id }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.preflight.outputs.source_sha }}
      - name: Release orchestration from the workflow commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.workflow_sha }}
          path: .release-tools
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          enable-cache: false
      - uses: actions/download-artifact@v5
        with:
          path: artifacts
          pattern: package-*
          merge-multiple: true
      - name: Verify exact package set and record source provenance
        run: |-
          uv run --no-project .release-tools/packaging/release/release_artifacts.py assemble artifacts --version "$VERSION" --source-sha "$SOURCE_SHA" --signing "$SIGNING" \
            --repository "$REPOSITORY" --run-id "$BUILD_RUN_ID" --rust-toolchain "$RUST_TOOLCHAIN"
      - uses: actions/upload-artifact@v5
        with:
          name: release-candidate-metadata
          path: artifacts/release-metadata.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
          overwrite: true
      - uses: actions/upload-artifact@v5
        with:
          name: verified-release
          path: artifacts/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
          overwrite: true
      - id: verified
        run: echo "artifact_name=verified-release" >> "$GITHUB_OUTPUT"
