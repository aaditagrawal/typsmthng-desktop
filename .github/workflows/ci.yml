name: Native GTK CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typst-compatibility:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Read pinned Rust toolchain
        id: toolchain
        shell: bash
        run: |
          toolchain="$(sed -n 's/^channel = "\([^"]*\)"/\1/p' rust-toolchain.toml | head -1)"
          [[ "$toolchain" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          echo "version=$toolchain" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.version }}
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
          shared-key: native-${{ runner.os }}-${{ runner.arch }}-dev
      - name: Backend and Typst compatibility without GTK
        run: scripts/test-typst-compatibility.sh
      - name: Headless Clippy
        run: cargo clippy --locked --workspace --no-default-features --all-targets -- -D warnings

  rust-quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Read pinned Rust toolchain
        id: toolchain
        shell: bash
        run: |
          toolchain="$(sed -n 's/^channel = "\([^"]*\)"/\1/p' rust-toolchain.toml | head -1)"
          [[ "$toolchain" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          echo "version=$toolchain" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.version }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
          shared-key: native-${{ runner.os }}-${{ runner.arch }}-dev
      - name: GTK development libraries
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libgtksourceview-5-dev libadwaita-1-dev librsvg2-common xvfb dbus-x11 flatpak-builder openbox xdotool imagemagick
      - name: Typst compiler for integration smoke
        run: |
          packaging/download-typst.sh x86_64-unknown-linux-musl /tmp/typst-dist
          sudo install -m755 /tmp/typst-dist/typst /usr/local/bin/typst
      - name: Validate Flatpak manifest
        run: flatpak-builder --show-manifest packaging/flatpak/dev.typsmthng.Typsmthng.yml >/dev/null
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          enable-cache: false
      - name: Release promotion and Flatpak cache regression checks
        run: |
          uv run --no-project packaging/release/test_release.py
          bash packaging/flatpak/test-build.sh
      - name: Formatting
        run: cargo fmt --manifest-path native/gtk/Cargo.toml --all -- --check
      - name: Tests
        run: cargo test --locked --manifest-path native/gtk/Cargo.toml --all-targets
      - name: Preview navigation and diagnostic timing
        run: dbus-run-session -- xvfb-run -a env GTK_A11Y=none GSK_RENDERER=cairo cargo test --locked --bin typsmthng native_preview_clicks_and_diagnostic_idle_timing -- --ignored --test-threads=1
      - name: Compiled document navigation and statistics
        run: dbus-run-session -- xvfb-run -a env GTK_A11Y=none GSK_RENDERER=cairo G_DEBUG=fatal-warnings cargo test --locked --bin typsmthng ui::workspace::tests::native_compiled_headings_statistics_and_cursor_navigation -- --exact --ignored --test-threads=1
      - name: Preview rendering at zoom and display scale
        run: |
          for scale in 1 2; do
            dbus-run-session -- xvfb-run -a env GTK_A11Y=none GSK_RENDERER=cairo GDK_SCALE="$scale" cargo test --locked --bin typsmthng native_svg_pages_follow_zoom_and_display_scale -- --ignored --test-threads=1
          done
      - name: Typst syntax highlighting grammar and schemes
        run: dbus-run-session -- xvfb-run -a env GTK_A11Y=none GSK_RENDERER=cairo G_DEBUG=fatal-warnings cargo test --locked --manifest-path native/gtk/Cargo.toml --test typst_highlighting -- --ignored --test-threads=1
      - name: Click-triggered native updates
        run: dbus-run-session -- xvfb-run -a env GTK_A11Y=none GSK_RENDERER=cairo cargo test --locked --bin typsmthng native_update_button_downloads_only_after_click -- --ignored --test-threads=1
      - name: Semantic completion keyboard and stale response checks
        run: dbus-run-session -- xvfb-run -a env GTK_A11Y=none GSK_RENDERER=cairo G_DEBUG=fatal-warnings cargo test --locked --bin typsmthng ui::editor_tools::tests::native_completion_inserts_snippet_once_and_discards_stale_reply -- --exact --ignored --test-threads=1
      - name: Explicit formatting undo, cursor, scroll and stale responses
        run: dbus-run-session -- xvfb-run -a env GTK_A11Y=none GSK_RENDERER=cairo G_DEBUG=fatal-warnings cargo test --locked --bin typsmthng ui::editor_tools::tests::native_formatting_preserves_selection_scroll_and_single_undo -- --exact --ignored --test-threads=1
      - name: Clippy
        run: cargo clippy --locked --manifest-path native/gtk/Cargo.toml --all-targets -- -D warnings
      - name: Dead dependency and migration-artifact audit
        run: |
          cargo install cargo-machete --version 0.9.2 --locked
          cargo machete
          if git ls-files | grep -E '(^|/)(node_modules|dist|artifacts|src/mainview|src/bun|electrobun|package\.json|bun\.lock|postcss\.config|tailwind\.config)(/|$|\.)'; then
            echo "Legacy web-runtime artifact is still tracked" >&2
            exit 1
          fi
      - name: Debug build and GTK X11 smoke test
        run: |
          cargo build --locked --manifest-path native/gtk/Cargo.toml
          dbus-run-session -- xvfb-run -a -s '-screen 0 1920x1080x24' env GTK_A11Y=none GSK_RENDERER=cairo G_DEBUG=fatal-warnings timeout 20s target/debug/typsmthng --smoke-test
          dbus-run-session -- xvfb-run -a -s '-screen 0 1920x1080x24' env GTK_A11Y=none GSK_RENDERER=cairo G_DEBUG=fatal-warnings timeout 30s target/debug/typsmthng --presentation-smoke-test native/gtk/tests/fixtures/demo
          dbus-run-session -- xvfb-run -a -s '-screen 0 1920x1080x24' env GTK_A11Y=none GSK_RENDERER=cairo G_DEBUG=fatal-warnings timeout 30s target/debug/typsmthng --interaction-smoke-test

      - name: Native document export options
        run: dbus-run-session -- xvfb-run -a env GTK_A11Y=none GSK_RENDERER=cairo G_DEBUG=fatal-warnings cargo test --locked --bin typsmthng ui::app::tests::native_export_dialog_keeps_default_pdf_and_scopes_profiles -- --exact --ignored --test-threads=1

      - name: Native dialog smoke tests
        run: |
          for view in templates import name settings export; do
            dbus-run-session -- xvfb-run -a env GTK_A11Y=none GSK_RENDERER=cairo G_DEBUG=fatal-warnings TYPSMTHNG_SMOKE_VIEW="$view" timeout 20s target/debug/typsmthng --smoke-test native/gtk/tests/fixtures/demo
          done

      - name: Native keyboard and pointer regression checks
        run: dbus-run-session -- xvfb-run -a -s '-screen 0 1600x1000x24' env G_DEBUG=fatal-warnings timeout 40s scripts/check-gtk4-interactions.sh

  platform-build:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            os: macos-14
          - name: macOS x64
            os: macos-15-intel
          - name: Windows x64
            os: windows-2022
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - name: Read pinned Rust toolchain
        id: toolchain
        shell: bash
        run: |
          toolchain="$(sed -n 's/^channel = "\([^"]*\)"/\1/p' rust-toolchain.toml | head -1)"
          [[ "$toolchain" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          echo "version=$toolchain" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.version }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
          shared-key: native-${{ runner.os }}-${{ runner.arch }}-ci
      - name: macOS GTK dependencies
        if: runner.os == 'macOS'
        run: brew install gtk4 gtksourceview5 libadwaita adwaita-icon-theme
      - uses: msys2/setup-msys2@v2
        if: runner.os == 'Windows'
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-gtk4
            mingw-w64-x86_64-libadwaita
            mingw-w64-x86_64-gtksourceview5
            mingw-w64-x86_64-pkgconf
            unzip
      - name: Windows GNU Rust target
        if: runner.os == 'Windows'
        run: rustup target add x86_64-pc-windows-gnu
      - name: Compile native application
        if: runner.os != 'Windows'
        shell: bash
        run: cargo build --locked --profile ci --manifest-path native/gtk/Cargo.toml
      - name: Compile native application (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          export PKG_CONFIG_ALLOW_CROSS=1
          export PKG_CONFIG_PATH=/mingw64/lib/pkgconfig:/mingw64/share/pkgconfig
          "$(cygpath -u "$CARGO_HOME")/bin/cargo.exe" build --locked --profile ci --features console --target x86_64-pc-windows-gnu --manifest-path native/gtk/Cargo.toml
      - name: Windows GTK and presentation smoke tests
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          packaging/download-typst.sh x86_64-pc-windows-msvc target/x86_64-pc-windows-gnu/ci
          export PATH="/mingw64/bin:$PWD/target/x86_64-pc-windows-gnu/ci:$PATH"
          timeout 20s target/x86_64-pc-windows-gnu/ci/typsmthng.exe --smoke-test
          timeout 30s target/x86_64-pc-windows-gnu/ci/typsmthng.exe --presentation-smoke-test native/gtk/tests/fixtures/demo
      - name: Compile windowed Windows binary
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          export PKG_CONFIG_ALLOW_CROSS=1
          export PKG_CONFIG_PATH=/mingw64/lib/pkgconfig:/mingw64/share/pkgconfig
          "$(cygpath -u "$CARGO_HOME")/bin/cargo.exe" build --locked --profile ci --target x86_64-pc-windows-gnu --manifest-path native/gtk/Cargo.toml
