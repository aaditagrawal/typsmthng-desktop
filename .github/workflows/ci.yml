name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: "1.3.14"

jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Run checks in parallel inside one job to avoid triple checkout/install overhead.
      - name: Typecheck, test, and vite build (parallel)
        run: |
          set -euo pipefail
          bun run typecheck &
          pid_typecheck=$!
          bun run test &
          pid_test=$!
          bunx vite build &
          pid_vite=$!

          status=0
          wait "$pid_typecheck" || status=1
          wait "$pid_test" || status=1
          wait "$pid_vite" || status=1
          exit "$status"
