name: Native GTK Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Version without the v prefix
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: gtk-release-${{ github.ref }}-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6
      - id: version
        shell: bash
        run: |
          version="${{ inputs.version || github.ref_name }}"
          version="${version#v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]] || exit 1
          manifest_version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' native/gtk/Cargo.toml | head -1)"
          [[ "$manifest_version" == "$version" ]] || { echo "Cargo version $manifest_version != $version"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

  linux:
    needs: preflight
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: native/gtk }
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libgtksourceview-5-dev librsvg2-common ruby-dev rpm libfuse2 flatpak flatpak-builder
          sudo gem install --no-document fpm
          sudo curl -fsSL -o /usr/local/bin/linuxdeploy https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          sudo chmod +x /usr/local/bin/linuxdeploy
          sudo curl -fsSL -o /usr/local/bin/linuxdeploy-plugin-gtk https://raw.githubusercontent.com/linuxdeploy/linuxdeploy-plugin-gtk/master/linuxdeploy-plugin-gtk.sh
          sudo chmod +x /usr/local/bin/linuxdeploy-plugin-gtk
      - name: Bundle Typst
        run: |
          curl -fsSL -o /tmp/typst.tar.xz https://github.com/typst/typst/releases/download/v0.15.1/typst-x86_64-unknown-linux-musl.tar.xz
          tar -xJf /tmp/typst.tar.xz -C /tmp
          sudo install -m755 /tmp/typst-x86_64-unknown-linux-musl/typst /usr/local/bin/typst
      - name: Tests and packages
        run: |
          cargo test --locked --manifest-path native/gtk/Cargo.toml --all-targets
          packaging/linux/build-system-packages.sh "${{ needs.preflight.outputs.version }}"
          packaging/linux/build-appimage.sh
          sudo flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          sudo flatpak install -y flathub org.gnome.Platform//48 org.gnome.Sdk//48
          flatpak-builder --force-clean --repo=build/flatpak-repo build/flatpak-build packaging/flatpak/dev.typsmthng.Typsmthng.yml
          flatpak build-bundle build/flatpak-repo "build/release/typsmthng_${{ needs.preflight.outputs.version }}_linux_x64.flatpak" dev.typsmthng.Typsmthng
      - uses: actions/upload-artifact@v5
        with:
          name: release-linux-x64
          path: build/release/*
          if-no-files-found: error

  macos:
    needs: preflight
    strategy:
      matrix:
        include:
          - os: macos-14
            arch: arm64
          - os: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: native/gtk }
      - run: |
          brew install gtk4 gtksourceview5 dylibbundler create-dmg
          machine="$(uname -m)"
          [[ "$machine" == "arm64" ]] && machine="aarch64"
          curl -fsSL -o /tmp/typst.tar.xz "https://github.com/typst/typst/releases/download/v0.15.1/typst-${machine}-apple-darwin.tar.xz"
          tar -xJf /tmp/typst.tar.xz -C /tmp
          sudo install -m755 "/tmp/typst-${machine}-apple-darwin/typst" /usr/local/bin/typst
      - name: Import signing certificate
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
        run: |
          test -n "$MACOS_CERTIFICATE_P12"
          test -n "$MACOS_CERTIFICATE_PASSWORD"
          test -n "$MACOS_KEYCHAIN_PASSWORD"
          echo "$MACOS_CERTIFICATE_P12" | base64 -D > /tmp/signing.p12
          security create-keychain -p "$MACOS_KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$MACOS_KEYCHAIN_PASSWORD" build.keychain
          security import /tmp/signing.p12 -k build.keychain -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$MACOS_KEYCHAIN_PASSWORD" build.keychain
      - name: Build and bundle
        env:
          MACOS_CODESIGN_IDENTITY: ${{ secrets.MACOS_CODESIGN_IDENTITY }}
        run: packaging/macos/bundle.sh "${{ needs.preflight.outputs.version }}" "${{ matrix.arch }}"
      - name: Notarize and staple
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          test -n "$APPLE_ID"
          test -n "$APPLE_APP_PASSWORD"
          test -n "$APPLE_TEAM_ID"
          dmg="build/release/typsmthng-${{ needs.preflight.outputs.version }}-macos-${{ matrix.arch }}.dmg"
          xcrun notarytool submit "$dmg" --apple-id "$APPLE_ID" --password "$APPLE_APP_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
          xcrun stapler staple "$dmg"
          xcrun stapler validate "$dmg"
      - uses: actions/upload-artifact@v5
        with:
          name: release-macos-${{ matrix.arch }}
          path: build/release/*.dmg
          if-no-files-found: error

  windows:
    needs: preflight
    runs-on: windows-2022
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-gtk4
            mingw-w64-x86_64-gtksourceview5
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-nsis
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: native/gtk }
      - name: Build
        run: |
          "$(cygpath -u "$CARGO_HOME")/bin/cargo.exe" build --locked --release --target x86_64-pc-windows-gnu --manifest-path native/gtk/Cargo.toml
          curl -fsSL -o /tmp/typst.zip https://github.com/typst/typst/releases/download/v0.15.1/typst-x86_64-pc-windows-msvc.zip
          unzip -q /tmp/typst.zip -d /tmp
          cp /tmp/typst-x86_64-pc-windows-msvc/typst.exe target/x86_64-pc-windows-gnu/release/typst.exe
      - name: Collect GTK runtime
        shell: pwsh
        run: packaging/windows/collect-runtime.ps1
      - name: Installer
        run: makensis packaging/windows/installer.nsi
      - uses: actions/upload-artifact@v5
        with:
          name: release-windows-x64
          path: build/release/*.exe
          if-no-files-found: error

  publish:
    needs: [preflight, linux, macos, windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: artifacts
          pattern: release-*
          merge-multiple: true
      - name: Checksums
        run: cd artifacts && sha256sum * > SHA256SUMS
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v${{ needs.preflight.outputs.version }}" artifacts/* --generate-notes --target "${{ github.sha }}"
