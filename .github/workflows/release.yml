name: Native GTK Release
on:
  push:
    tags:
      - v*
  workflow_dispatch:
    inputs:
      version:
        description: Version without the v prefix
        required: true
        type: string
      source_ref:
        description: Immutable release source tag or commit (for example v0.1.0)
        type: string
        required: false
      publish:
        description: Publish after all packages pass verification
        type: boolean
        default: true
      macos_signing:
        description: macOS signing (unsigned uses ad-hoc signatures without notarization)
        type: choice
        options:
          - unsigned
          - signed
        default: unsigned
permissions:
  contents: read
  actions: read
concurrency:
  group: gtk-release-${{ github.ref }}-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      macos_signing: ${{ steps.version.outputs.macos_signing }}
      source_sha: ${{ steps.version.outputs.source_sha }}
      rust_toolchain: ${{ steps.version.outputs.rust_toolchain }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_ref || github.ref }}
      - name: Release orchestration from the workflow commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.workflow_sha }}
          path: .release-tools
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          enable-cache: false
      - id: version
        env:
          RAW_VERSION: ${{ inputs.version || github.ref_name }}
          REQUESTED_SIGNING: ${{ inputs.macos_signing }}
        run: uv run --no-project .release-tools/packaging/release/source.py
  candidate:
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    outputs:
      run_id: ${{ steps.candidate.outputs.run_id }}
    env:
      VERSION: ${{ needs.preflight.outputs.version }}
      SOURCE_SHA: ${{ needs.preflight.outputs.source_sha }}
      SIGNING: ${{ needs.preflight.outputs.macos_signing }}
      RUST_TOOLCHAIN: ${{ needs.preflight.outputs.rust_toolchain }}
      REPOSITORY: ${{ github.repository }}
      BUILD_RUN_ID: ${{ github.run_id }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.preflight.outputs.source_sha }}
      - name: Release orchestration from the workflow commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.workflow_sha }}
          path: .release-tools
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          enable-cache: false
      - id: candidate
        name: Reuse an exact verified candidate or wait for its active build
        run: |-
          uv run --no-project .release-tools/packaging/release/find-candidate.py \
            --repository "$REPOSITORY" --source-sha "$SOURCE_SHA" --version "$VERSION" \
            --signing "$SIGNING" --rust-toolchain "$RUST_TOOLCHAIN"
  packages:
    needs:
      - preflight
      - candidate
    if: needs.candidate.outputs.run_id == ''
    uses: ./.github/workflows/release-build.yml
    with:
      version: ${{ needs.preflight.outputs.version }}
      source_sha: ${{ needs.preflight.outputs.source_sha }}
      macos_signing: ${{ needs.preflight.outputs.macos_signing }}
    secrets: inherit
  publish:
    needs:
      - preflight
      - candidate
      - packages
    if: always() && !cancelled() && needs.preflight.result == 'success' && needs.candidate.result == 'success' && (needs.packages.result == 'success' || (needs.packages.result ==
      'skipped' && needs.candidate.outputs.run_id != ''))
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    env:
      VERSION: ${{ needs.preflight.outputs.version }}
      SOURCE_SHA: ${{ needs.preflight.outputs.source_sha }}
      SIGNING: ${{ needs.preflight.outputs.macos_signing }}
      RUST_TOOLCHAIN: ${{ needs.preflight.outputs.rust_toolchain }}
      REPOSITORY: ${{ github.repository }}
      BUILD_RUN_ID: ${{ needs.candidate.outputs.run_id || github.run_id }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.preflight.outputs.source_sha }}
      - name: Release orchestration from the workflow commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.workflow_sha }}
          path: .release-tools
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          enable-cache: false
      - uses: actions/download-artifact@v5
        with:
          name: verified-release
          path: artifacts
          run-id: ${{ needs.candidate.outputs.run_id || github.run_id }}
          github-token: ${{ github.token }}
      - name: Verify candidate metadata, exact assets, and every checksum
        run: |-
          uv run --no-project .release-tools/packaging/release/release_artifacts.py verify artifacts --version "$VERSION" --source-sha "$SOURCE_SHA" --signing "$SIGNING" \
            --repository "$REPOSITORY" --run-id "$BUILD_RUN_ID" --rust-toolchain "$RUST_TOOLCHAIN"
      - name: Publish GitHub release
        if: github.event_name != 'workflow_dispatch' || inputs.publish
        env:
          PRERELEASE: ${{ needs.preflight.outputs.prerelease }}
        run: |-
          uv run --no-project .release-tools/packaging/release/tag.py --version "$VERSION" --source-sha "$SOURCE_SHA"
          title="v$VERSION"
          notes="releases/v$VERSION.md"
          test -f "$notes"
          if [[ "$SIGNING" == unsigned ]]; then
            printf '\nmacOS builds are unsigned (ad-hoc signed) and are not notarized by Apple.\n' >> "$notes"
          fi
          flags=(--notes-file "$notes" --title "$title" --target "$SOURCE_SHA")
          if [[ "$PRERELEASE" == true ]]; then
            flags+=(--prerelease)
          else
            flags+=(--latest)
          fi
          # Build provenance stays in Actions; publish only installers and their checksums.
          rm artifacts/release-metadata.json
          gh release create "v$VERSION" artifacts/* --repo "$REPOSITORY" "${flags[@]}"
  copr:
    needs:
      - preflight
      - publish
    if: vars.COPR_PROJECT != '' && (github.event_name != 'workflow_dispatch' || inputs.publish)
    uses: ./.github/workflows/copr.yml
    with:
      source_ref: ${{ needs.preflight.outputs.source_sha }}
      submit: true
    secrets:
      COPR_CONFIG: ${{ secrets.COPR_CONFIG }}
